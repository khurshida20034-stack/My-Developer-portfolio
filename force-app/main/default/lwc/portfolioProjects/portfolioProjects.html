<template>
    <section class="section" aria-labelledby="projects-title">
        <div class="container">
            <p class="eyebrow">Things I have built</p>
            <h2 id="projects-title" class="section-title">Projects</h2>
            <template lwc:if={hasProjects}>
                <div class="grid">
                    <template for:each={cards} for:item="project">
                        <article key={project.id} class="card project">
                            <span lwc:if={project.featured} class="badge">Featured</span>
                            <h3 class="project-title">{project.title}</h3>
                            <p class="project-desc">{project.description}</p>
                            <ul class="tags" aria-label="Technologies">
                                <template for:each={project.tags} for:item="tag">
                                    <li key={tag.key} class="tag">{tag.label}</li>
                                </template>
                            </ul>
                            <div class="links">
                                <a lwc:if={project.github} href={project.github} target="_blank" rel="noopener noreferrer">GitHub</a>
                                <a lwc:if={project.demo} href={project.demo} target="_blank" rel="noopener noreferrer">Live demo</a>
                            </div>
                        </article>
                    </template>
                </div>
            </template>
            <p lwc:else class="empty">Projects are coming soon.</p>
            <p lwc:if={profileLink} class="more"><a class="btn btn-outline" href={profileLink} target="_blank" rel="noopener noreferrer">More on GitHub</a></p>
        </div>
    </section>
</template>
